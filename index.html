<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Analyze a song and generate a unique mini web app from its mood, energy, tempo, palette, and lyrics." />
    <meta property="og:title" content="Song to App" />
    <meta property="og:description" content="Turn song audio into a generated browser mini app with Web Audio, Whisper, and Claude." />
    <meta property="og:image" content="./assets/social-preview.svg" />
    <title>Song to App</title>
    <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #15161a;
        --muted: #66717f;
        --paper: #f4f7fb;
        --panel: #ffffff;
        --panel-soft: #f8fafc;
        --line: #dfe6ee;
        --line-strong: #b8c4d2;
        --green: #0c9b72;
        --green-dark: #067253;
        --coral: #f05d3c;
        --yellow: #e7b91b;
        --blue: #3156d4;
        --pink: #be3f7b;
        --shadow: 0 22px 60px rgba(24, 35, 54, 0.11);
        --shadow-soft: 0 10px 30px rgba(24, 35, 54, 0.08);
        --radius: 8px;
        --drop-border: rgba(49, 86, 212, 0.5);
        --drop-bg: rgba(49, 86, 212, 0.06);
      }

      [data-theme="dark"] {
        color-scheme: dark;
        --ink: #e8edf4;
        --muted: #8a97a8;
        --paper: #0f1116;
        --panel: #181b22;
        --panel-soft: #1c2029;
        --line: #272d38;
        --line-strong: #384050;
        --shadow: 0 22px 60px rgba(0, 0, 0, 0.45);
        --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.32);
        --drop-border: rgba(49, 86, 212, 0.6);
        --drop-bg: rgba(49, 86, 212, 0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        min-height: 100%;
        overflow-x: hidden;
      }

      body {
        margin: 0;
        background:
          linear-gradient(90deg, rgba(49, 86, 212, 0.055) 1px, transparent 1px),
          linear-gradient(0deg, rgba(12, 155, 114, 0.045) 1px, transparent 1px),
          linear-gradient(135deg, #f5f8fc 0%, #edf7f5 48%, #fff6f0 100%);
        background-size: 34px 34px, 34px 34px, auto;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
        transition: background 0.3s ease, color 0.2s ease;
      }

      [data-theme="dark"] body {
        background:
          linear-gradient(90deg, rgba(49, 86, 212, 0.04) 1px, transparent 1px),
          linear-gradient(0deg, rgba(12, 155, 114, 0.03) 1px, transparent 1px),
          linear-gradient(135deg, #0b0d11 0%, #0d1118 48%, #0f0e12 100%);
        background-size: 34px 34px, 34px 34px, auto;
      }

      button, input, select, textarea { font: inherit; }
      button { border: 0; }
      button:disabled, input:disabled, select:disabled, textarea:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(18px);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.82);
        position: sticky;
        top: 0;
        z-index: 20;
        transition: background 0.3s ease, border-color 0.2s ease;
      }

      [data-theme="dark"] .topbar {
        background: rgba(24, 27, 34, 0.9);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .topbar-inner {
        width: min(1420px, calc(100vw - 32px));
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 76px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .mark {
        width: 44px;
        height: 44px;
        border-radius: var(--radius);
        background:
          linear-gradient(135deg, var(--coral), transparent 58%),
          linear-gradient(225deg, var(--blue), transparent 54%),
          var(--green);
        display: grid;
        place-items: center;
        color: white;
        font-weight: 900;
        box-shadow: 0 8px 22px rgba(12, 155, 114, 0.24);
        flex-shrink: 0;
      }

      .brand-copy {
        display: grid;
        gap: 2px;
        min-width: 0;
      }

      .kicker {
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.25rem, 2vw, 1.75rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .topbar-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .model-chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.68);
        color: var(--ink);
        font-size: 0.82rem;
        font-weight: 800;
        padding: 8px 12px;
        white-space: nowrap;
        box-shadow: var(--shadow-soft);
      }

      [data-theme="dark"] .model-chip {
        background: rgba(255, 255, 255, 0.06);
      }

      .theme-toggle {
        width: 40px;
        height: 40px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        display: grid;
        place-items: center;
        font-size: 1.1rem;
        transition: border-color 0.15s, background 0.15s, transform 0.15s;
        flex-shrink: 0;
      }

      .theme-toggle:hover {
        border-color: var(--ink);
        transform: translateY(-1px);
      }

      .shell {
        width: min(1420px, calc(100vw - 32px));
        margin: 22px auto 38px;
        display: grid;
        grid-template-columns: minmax(380px, 500px) minmax(0, 1fr);
        gap: 20px;
        flex: 1;
      }

      .left-stack, .right-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
        max-width: 100%;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      /* Drag-and-drop overlay on the audio input panel */
      .panel.drag-over {
        border-color: var(--drop-border);
        background: var(--drop-bg);
        box-shadow: 0 0 0 3px rgba(49, 86, 212, 0.18), var(--shadow);
      }

      .drop-hint {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 10;
        background: var(--drop-bg);
        border: 2px dashed var(--drop-border);
        border-radius: var(--radius);
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 1.1rem;
        color: var(--blue);
        pointer-events: none;
        gap: 10px;
      }

      .panel.drag-over .drop-hint { display: flex; }
      .panel-drop-wrap { position: relative; }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, var(--panel) 0%, var(--panel-soft) 100%);
      }

      .panel-title {
        margin: 0;
        font-size: 0.96rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      .panel-body { padding: 18px; }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        min-width: 0;
      }

      .button, .file-button {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 15px;
        border-radius: var(--radius);
        border: 1px solid var(--line-strong);
        background: var(--panel);
        color: var(--ink);
        font-weight: 750;
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease, background 150ms ease, color 150ms ease;
      }

      .button:hover, .file-button:hover {
        transform: translateY(-1px);
        border-color: var(--ink);
        box-shadow: var(--shadow-soft);
      }

      .button:disabled:hover, .file-button:has(input:disabled):hover {
        transform: none;
        border-color: var(--line-strong);
        box-shadow: none;
      }

      .button:focus-visible, .file-button:focus-visible, .segment:focus-visible {
        outline: 3px solid rgba(49, 86, 212, 0.32);
        outline-offset: 2px;
      }

      .button.primary, .file-button.primary {
        background: linear-gradient(135deg, var(--green), #087c8e);
        border-color: rgba(12, 155, 114, 0.72);
        color: white;
        box-shadow: 0 12px 28px rgba(12, 155, 114, 0.2);
      }

      .button.primary:hover, .file-button.primary:hover {
        background: linear-gradient(135deg, var(--green-dark), #075c72);
        border-color: var(--green-dark);
      }

      .button.secondary { background: #15161a; border-color: #15161a; color: white; }
      .button.coral { background: var(--coral); border-color: var(--coral); color: white; }

      .button.ghost {
        background: rgba(255, 255, 255, 0.56);
      }

      [data-theme="dark"] .button.ghost {
        background: rgba(255, 255, 255, 0.07);
      }

      .button.icon { width: 40px; padding: 0; flex: 0 0 auto; }

      .hidden-input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .field-grid { display: grid; gap: 14px; }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .field { display: grid; gap: 6px; min-width: 0; }

      .field span {
        font-size: 0.78rem;
        color: var(--muted);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .field input, .field select, .field textarea {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        padding: 10px 11px;
        background: var(--panel);
        color: var(--ink);
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s, background 0.2s;
      }

      .field textarea { min-height: 90px; resize: vertical; }

      .field input:focus, .field select:focus, .field textarea:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(49, 86, 212, 0.14);
      }

      .hint { color: var(--muted); font-size: 0.86rem; line-height: 1.45; }

      .header-chips { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }

      .mini-chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel-soft);
        color: var(--muted);
        font-size: 0.74rem;
        font-weight: 850;
        padding: 5px 8px;
        white-space: nowrap;
      }

      .mini-chip.ready {
        border-color: rgba(12, 155, 114, 0.28);
        background: rgba(12, 155, 114, 0.09);
        color: var(--green-dark);
      }

      .analysis-summary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: stretch;
        gap: 12px;
        margin-bottom: 14px;
      }

      .mood-readout, .tempo-readout {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: linear-gradient(135deg, rgba(49, 86, 212, 0.08), rgba(12, 155, 114, 0.06)), var(--panel);
        padding: 14px;
        min-width: 0;
        transition: background 0.2s;
      }

      .summary-label {
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .mood-readout strong, .tempo-readout strong {
        display: block;
        margin-top: 5px;
        color: var(--ink);
        font-size: clamp(1.45rem, 4vw, 2.2rem);
        line-height: 1;
        overflow-wrap: anywhere;
      }

      .summary-sub {
        display: block;
        margin-top: 7px;
        color: var(--muted);
        font-size: 0.86rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tempo-readout { min-width: 112px; text-align: center; }
      .tempo-readout small { color: var(--muted); font-weight: 850; }

      .wave-wrap {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
        background: #121417;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      canvas.waveform { width: 100%; height: 152px; display: block; }
      audio { width: 100%; margin-top: 12px; }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 14px;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 11px;
        min-width: 0;
        background: linear-gradient(180deg, var(--panel), var(--panel-soft));
        transition: background 0.2s;
      }

      .metric-label {
        color: var(--muted);
        font-size: 0.74rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .metric-value {
        margin-top: 4px;
        font-weight: 850;
        font-size: 1.04rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .frequency-bars { display: grid; gap: 8px; margin-top: 14px; }

      .frequency-row {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr) 42px;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .frequency-track {
        height: 8px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }

      .frequency-fill {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--green), var(--blue));
        transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .palette { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

      .swatch {
        flex: 1 1 42px;
        min-width: 42px;
        height: 30px;
        border-radius: 6px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
        transition: transform 0.15s;
        cursor: default;
      }

      .swatch:hover { transform: scaleY(1.15); }

      .palette-name {
        width: 100%;
        font-size: 0.75rem;
        color: var(--muted);
        font-weight: 700;
        margin-top: 6px;
      }

      .chips { display: flex; gap: 8px; flex-wrap: wrap; }

      .chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        min-height: 30px;
        padding: 5px 10px;
        color: var(--ink);
        background: var(--panel-soft);
        font-size: 0.86rem;
        font-weight: 700;
      }

      .segmented {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .segment {
        min-height: 40px;
        background: var(--panel);
        color: var(--ink);
        border-right: 1px solid var(--line);
        cursor: pointer;
        font-weight: 760;
        padding: 0 9px;
        transition: background 0.12s, color 0.12s;
      }

      .segment:last-child { border-right: 0; }

      .segment.active {
        background: linear-gradient(135deg, var(--ink), #263042);
        color: white;
      }

      [data-theme="dark"] .segment.active {
        background: linear-gradient(135deg, #3a4259, #2a3048);
        color: #e8edf4;
      }

      .status {
        min-height: 36px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 0.92rem;
        margin: 12px 0;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel-soft);
      }

      .spinner {
        width: 18px;
        height: 18px;
        border: 3px solid rgba(12, 155, 114, 0.18);
        border-top-color: var(--green);
        border-radius: 50%;
        animation: spin 800ms linear infinite;
        flex-shrink: 0;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      details {
        border-top: 1px solid var(--line);
        background: var(--panel-soft);
      }

      summary {
        list-style: none;
        cursor: pointer;
        padding: 14px 16px;
        font-weight: 850;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--ink);
        transition: background 0.12s;
      }

      summary:hover { background: var(--line); }
      summary::-webkit-details-marker { display: none; }

      .details-body { padding: 0 16px 16px; }

      .json-view, .stream-view {
        background: #12151b;
        color: #eff5eb;
        border-radius: var(--radius);
        padding: 12px;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.78rem;
        line-height: 1.5;
        overflow: auto;
        max-height: 260px;
        white-space: pre-wrap;
      }

      .error-box {
        background: rgba(240, 93, 60, 0.08);
        border: 1px solid rgba(240, 93, 60, 0.28);
        border-radius: var(--radius);
        padding: 10px 12px;
        color: var(--coral);
        font-size: 0.88rem;
        font-weight: 700;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-top: 4px;
      }

      .error-box-icon { flex-shrink: 0; margin-top: 1px; }

      .preview-shell {
        min-height: 660px;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .preview-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }

      .preview-toolbar-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .preview-frame-wrap {
        position: relative;
        min-height: 600px;
        background:
          linear-gradient(90deg, rgba(23, 25, 28, 0.06) 1px, transparent 1px),
          linear-gradient(0deg, rgba(23, 25, 28, 0.06) 1px, transparent 1px),
          #fdfefb;
        background-size: 22px 22px;
      }

      [data-theme="dark"] .preview-frame-wrap {
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(0deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          #0a0c10;
        background-size: 22px 22px;
      }

      iframe {
        width: 100%;
        height: 100%;
        min-height: 600px;
        border: 0;
        display: block;
        background: white;
      }

      .empty-preview {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        color: var(--ink);
        text-align: center;
      }

      .empty-preview-card {
        display: grid;
        justify-items: center;
        gap: 18px;
        width: min(430px, 100%);
      }

      .empty-visual {
        width: min(320px, 82vw);
        height: 160px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: linear-gradient(180deg, rgba(21, 22, 26, 0.92), rgba(21, 22, 26, 0.98)), #15161a;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 20px;
        box-shadow: var(--shadow-soft);
      }

      .empty-bar {
        width: 8px;
        height: var(--bar-height);
        border-radius: 999px;
        background: linear-gradient(180deg, var(--yellow), var(--coral), var(--blue));
      }

      .empty-preview-card strong { font-size: 1.35rem; }

      .empty-preview-card p {
        margin: -8px 0 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .empty-preview-card .actions { justify-content: center; }

      /* Gallery */
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 12px;
      }

      .gallery-item {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px;
        background: linear-gradient(180deg, var(--panel), var(--panel-soft));
        display: grid;
        gap: 8px;
        box-shadow: var(--shadow-soft);
        transition: transform 0.15s, box-shadow 0.15s;
        position: relative;
        overflow: hidden;
      }

      .gallery-item:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow);
      }

      .gallery-mood-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
      }

      .gallery-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .gallery-actions .button { min-height: 34px; padding: 0 10px; }

      .gallery-name {
        font-weight: 820;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding-top: 4px;
      }

      .gallery-meta { color: var(--muted); font-size: 0.82rem; }
      .danger-text { color: #8e2f1f; }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        background: var(--ink);
        color: var(--panel);
        border-radius: var(--radius);
        padding: 10px 14px;
        box-shadow: var(--shadow);
        z-index: 50;
        font-weight: 750;
        font-size: 0.92rem;
        animation: toast-in 0.2s ease;
      }

      @keyframes toast-in {
        from { opacity: 0; transform: translateY(8px); }

          for (let i = 0; i < len; i++) mono[i] += src[i] / ch;

          const start = i * bucket;

          for (let j = start; j < end; j++) peak = Math.max(peak, Math.abs(samples[j]));

            const idx = i + j;
            if (idx >= 0 && idx < values.length) { sum += values[idx]; count++; }

          result[i] = sum / count;
        }

        if (!samples || samples.length < sampleRate * 4) return null;
        const hop = 512, frame = 1024;
        const envLen = Math.max(0, Math.floor((samples.length - frame) / hop));
        const envelope = new Float32Array(envLen);
        for (let i = 0; i < envLen; i++) {
          const start = i * hop;
          let sum = 0;
          for (let j = 0; j < frame; j++) { const v = samples[start + j] || 0; sum += v * v; }
          envelope[i] = Math.sqrt(sum / frame);

        const smoothed = smooth(envelope, 3);
        let mean = 0;
        for (const v of smoothed) mean += v;
        mean /= Math.max(1, smoothed.length);
        let variance = 0;
        for (const v of smoothed) variance += (v - mean) * (v - mean);
        const std = Math.sqrt(variance / Math.max(1, smoothed.length));

        for (let i = 2; i < smoothed.length - 2; i++) {

          return json.content.map(p => (typeof p === "string" ? p : p?.text || "")).join("");
        }
        if (json.message) return extractAnthropicJsonText(json.message);
        return "";
      }

      async function readAnthropicStream(response, onText) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "", full = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split(/\r?\n\r?\n/);
          buffer = events.pop() || "";
          for (const ev of events) {
            const dataLines = ev.split(/\r?\n/)
              .filter(l => l.startsWith("data:"))
              .map(l => l.slice(5).trim());
            for (const line of dataLines) {
              if (!line || line === "[DONE]") continue;
              try {
                const event = JSON.parse(line);
                const token = event.delta?.text || event.content_block?.text || event.message?.content?.[0]?.text || "";
                if (token) { full += token; onText(full); }
              } catch { full += line; onText(full); }
            }
          }
        }
        return full;
      }

      async function readPlainStream(response, onText) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let full = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          full += decoder.decode(value, { stream: true });
          onText(full);
        }
        return full;
      }

      async function callClaude({ prompt, apiKey, proxyUrl, onText }) {
        const url = proxyUrl || "https://api.anthropic.com/v1/messages";
        if (!proxyUrl && !apiKey) throw new Error("Add an Anthropic API key or a Claude proxy URL.");
        const body = {
          model: CLAUDE_MODEL,
          max_tokens: 6000,
          stream: true,
          messages: [{ role: "user", content: prompt }],
        };
        const headers = { "Content-Type": "application/json" };
        if (!proxyUrl) {
          headers["x-api-key"] = apiKey;
          headers["anthropic-version"] = "2023-06-01";
          headers["anthropic-dangerous-direct-browser-access"] = "true";
        }
        const response = await fetch(url, { method: "POST", headers, body: JSON.stringify(body) });
        if (!response.ok) {
          const errText = await response.text().catch(() => "");
          throw new Error(`Claude request failed (${response.status}). ${errText.slice(0, 400)}`);
        }
        const ct = response.headers.get("content-type") || "";
        if (ct.includes("text/event-stream") && response.body) return readAnthropicStream(response, onText);
        if (ct.includes("application/json")) {
          const json = await response.json();
          const text = extractAnthropicJsonText(json);
          onText(text); return text;
        }
        if (response.body) return readPlainStream(response, onText);
        const text = await response.text();
        onText(text); return text;
      }

      async function callWhisper({ blob, fileName, apiKey, proxyUrl }) {
        if (!apiKey && !proxyUrl) throw new Error("Add an OpenAI API key or a Whisper proxy URL.");
        const form = new FormData();
        const safeName = fileName && /\.[a-z0-9]+$/i.test(fileName) ? fileName : "song.webm";
        form.append("file", new File([blob], safeName, { type: blob.type || "audio/webm" }));
        form.append("model", "whisper-1");
        form.append("response_format", "json");
        const response = await fetch(proxyUrl || "https://api.openai.com/v1/audio/transcriptions", {
          method: "POST",
          headers: proxyUrl ? undefined : { Authorization: `Bearer ${apiKey}` },
          body: form,
        });
        if (!response.ok) {
          const errText = await response.text().catch(() => "");
          throw new Error(`Whisper request failed (${response.status}). ${errText.slice(0, 300)}`);
        }
        const json = await response.json();
        return json.text || "";
      }

      function normalizeFileName(name, fallback) {
        return (name || fallback).replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "").toLowerCase() || fallback;
      }

      function formatDateTime(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return date.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      }

      async function copyText(text) {
        if (!text) return false;
        if (navigator.clipboard?.writeText) {
          try { await navigator.clipboard.writeText(text); return true; } catch {}
        }
        const ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;left:-9999px;top:0";
        document.body.appendChild(ta); ta.select();
        try { return document.execCommand("copy"); } catch { return false; }
        finally { ta.remove(); }
      }

      function downloadText(text, name, type) {
        const blob = new Blob([text], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
      }

      function downloadHtml(html, name) {
        downloadText(html, `${normalizeFileName(name, "song-app")}.html`, "text/html;charset=utf-8");
      }

      function openInTab(html) {
        const blob = new Blob([html], { type: "text/html" });
        const url = URL.createObjectURL(blob);
        window.open(url, "_blank", "noopener");
        // Revoke after a generous delay so the tab has time to load
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      }

      function loadGallery() {
        try { return normalizeGallery(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]")); }
        catch { return []; }
      }

      function normalizeGallery(items) {
        if (!Array.isArray(items)) return [];
        return items.map((item, i) => {
          if (!item || typeof item.html !== "string" || !item.html.trim()) return null;
          return {
            id: String(item.id || `${Date.now()}-${i}`),
            html: item.html,
            engine: item.engine || "App",
            mood: item.mood || "unknown",
            bpm: Number.isFinite(item.bpm) ? item.bpm : null,
            sourceName: item.sourceName || "song",
            createdAt: item.createdAt || new Date().toISOString(),
          };
        }).filter(Boolean).slice(0, 8);
      }

      function saveGallery(items) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(normalizeGallery(items))); } catch {}
      }

      /* ─── Small reusable components ─── */

      function Button({ children, className, ...props }) {

      }

      function FrequencyBars({ profile }) {
        const rows = [["Bass", profile?.bass||0], ["Mid", profile?.mid||0], ["Treble", profile?.treble||0]];
        return h("div", { className: "frequency-bars", "aria-label": "Frequency balance" },

                })

            )
          )

      function WaveformCanvas({ waveform, isRecording, analyserRef, audioRef, palette }) {
        const canvasRef = useRef(null);
        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return undefined;
          const ctx = canvas.getContext("2d");
          let raf = 0;
          const colors = palette?.colors || palettes.chill.colors;

          function fitCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const width  = Math.max(1, Math.floor(rect.width  * dpr));
            const height = Math.max(1, Math.floor(rect.height * dpr));
            if (canvas.width !== width || canvas.height !== height) {
              canvas.width = width; canvas.height = height;
            }
            return { width, height };
          }

          function drawIdle(width, height) {
            const bars = waveform?.length ? waveform : Array.from({ length: 96 }, () => 0.04);
            const gap = 2, barWidth = Math.max(2, width / bars.length - gap);
            const center = height / 2;
            ctx.fillStyle = "#121417"; ctx.fillRect(0, 0, width, height);
            ctx.strokeStyle = "rgba(255,255,255,0.08)";
            ctx.beginPath(); ctx.moveTo(0, center); ctx.lineTo(width, center); ctx.stroke();
            for (let i = 0; i < bars.length; i++) {
              const x = i * (barWidth + gap);
              const barHeight = Math.max(3, bars[i] * height * 0.84);
              ctx.fillStyle = colors[i % colors.length];
              ctx.globalAlpha = waveform?.length ? 0.88 : 0.22;
              ctx.fillRect(x, center - barHeight / 2, barWidth, barHeight);
            }
            ctx.globalAlpha = 1;
            const audio = audioRef?.current;
            if (audio && audio.duration && !audio.paused) {
              const px = (audio.currentTime / audio.duration) * width;
              ctx.fillStyle = "#ffffff"; ctx.fillRect(px, 0, 2, height);
            }
          }

          function drawLive(width, height) {
            const analyser = analyserRef.current;
            if (!analyser) { drawIdle(width, height); return; }
            const data = new Uint8Array(analyser.fftSize);
            analyser.getByteTimeDomainData(data);
            ctx.fillStyle = "#121417"; ctx.fillRect(0, 0, width, height);
            ctx.lineWidth = Math.max(2, width / 340);
            ctx.strokeStyle = colors[0] || "#0c9b72";
            ctx.beginPath();
            for (let i = 0; i < data.length; i++) {
              const x = (i / (data.length - 1)) * width, y = (data[i] / 255) * height;
              i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.strokeStyle = colors[2] || "#ff7a45"; ctx.globalAlpha = 0.5;
            ctx.beginPath();
            for (let i = 0; i < data.length; i += 3) {
              const x = (i / (data.length - 1)) * width, y = height - (data[i] / 255) * height;
              i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.stroke(); ctx.globalAlpha = 1;
          }

          function render() {
            const { width, height } = fitCanvas();
            isRecording ? drawLive(width, height) : drawIdle(width, height);
            raf = requestAnimationFrame(render);
          }
          render();
          window.addEventListener("resize", fitCanvas);
          return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", fitCanvas); };
        }, [waveform, isRecording, analyserRef, audioRef, palette]);

        return h("canvas", { className: "waveform", ref: canvasRef, "aria-hidden": "true" });
      }

      /* ─── Main App component ─── */

      function App() {
        const [analysis, setAnalysis]         = useState(emptyAnalysis);
        const [waveform, setWaveform]         = useState([]);
        const [audioBlob, setAudioBlob]       = useState(null);
        const [audioUrl, setAudioUrl]         = useState("");
        const [isRecording, setIsRecording]   = useState(false);
        const [isAnalyzing, setIsAnalyzing]   = useState(false);
        const [isTranscribing, setIsTranscribing] = useState(false);
        const [isGenerating, setIsGenerating] = useState(false);
        const [status, setStatus]             = useState("Ready");
        const [error, setError]               = useState("");
        const [generatedHtml, setGeneratedHtml] = useState("");
        const [streamText, setStreamText]     = useState("");
        const [promptText, setPromptText]     = useState("");
        const [appType, setAppType]           = useState("random");
        const [feedback, setFeedback]         = useState("");
        const [rating, setRating]             = useState(0);
        const [variation, setVariation]       = useState(1);
        const [gallery, setGallery]           = useState(loadGallery);
        const [toast, setToast]               = useState("");
        const [isDragging, setIsDragging]     = useState(false);

        // Dark mode: init from localStorage or system preference
        const getInitialTheme = () => {
          const saved = getStoredLocal(THEME_KEY);
          if (saved === "dark" || saved === "light") return saved;
          return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        };
        const [theme, setTheme] = useState(getInitialTheme);

        useEffect(() => {
          document.documentElement.setAttribute("data-theme", theme);
          setStoredLocal(THEME_KEY, theme);
        }, [theme]);

        const toggleTheme = useCallback(() => {
          setTheme(t => t === "dark" ? "light" : "dark");
        }, []);

        const [anthropicKey, setAnthropicKey]   = useState(() => getStored(API_STORAGE.anthropicKey));
        const [anthropicProxy, setAnthropicProxy] = useState(() => getStored(API_STORAGE.anthropicProxy));
        const [openaiKey, setOpenaiKey]         = useState(() => getStored(API_STORAGE.openaiKey));
        const [openaiProxy, setOpenaiProxy]     = useState(() => getStored(API_STORAGE.openaiProxy));

        const mediaRecorderRef     = useRef(null);
        const chunksRef            = useRef([]);
        const streamRef            = useRef(null);
        const recordingContextRef  = useRef(null);
        const analyserRef          = useRef(null);
        const audioRef             = useRef(null);

        useEffect(() => setStored(API_STORAGE.anthropicKey,   anthropicKey),   [anthropicKey]);
        useEffect(() => setStored(API_STORAGE.anthropicProxy, anthropicProxy), [anthropicProxy]);
        useEffect(() => setStored(API_STORAGE.openaiKey,      openaiKey),      [openaiKey]);
        useEffect(() => setStored(API_STORAGE.openaiProxy,    openaiProxy),    [openaiProxy]);

        useEffect(() => {
          if (!toast) return undefined;
          const t = setTimeout(() => setToast(""), 2400);
          return () => clearTimeout(t);
        }, [toast]);

        useEffect(() => {
          return () => {
            if (audioUrl) URL.revokeObjectURL(audioUrl);
            streamRef.current?.getTracks().forEach(t => t.stop());
            recordingContextRef.current?.close?.();
          };
        }, [audioUrl]);

        const hasAnalysis      = analysis.mood !== "unknown";
        const hasClaudeAccess  = Boolean(anthropicKey.trim() || anthropicProxy.trim());
        const hasWhisperAccess = Boolean(openaiKey.trim() || openaiProxy.trim());
        const bpmLabel = Number.isFinite(analysis.bpm) ? analysis.bpm : "--";
        const activeThemes = useMemo(
          () => analysis.themes.length ? analysis.themes : instrumentalThemes(analysis),
          [analysis]
        );
        const busy = isRecording || isAnalyzing || isTranscribing || isGenerating;

        // ── Keyboard shortcuts ──────────────────────────────────────────
        useEffect(() => {
          function onKey(e) {
            if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
            if ((e.metaKey || e.ctrlKey) && e.key === "d") { e.preventDefault(); toggleTheme(); }
            if ((e.metaKey || e.ctrlKey) && e.key === "g" && hasAnalysis && !isGenerating && hasClaudeAccess) {
              e.preventDefault(); generateApp(false);
            }
          }
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [hasAnalysis, isGenerating, hasClaudeAccess, toggleTheme]);

        // ── Drag-and-drop handlers ───────────────────────────────────────
        function onDragOver(e) { e.preventDefault(); setIsDragging(true); }
        function onDragLeave(e) { if (!e.currentTarget.contains(e.relatedTarget)) setIsDragging(false); }
        function onDrop(e) {
          e.preventDefault(); setIsDragging(false);
          const file = e.dataTransfer?.files?.[0];
          if (file && file.type.startsWith("audio")) analyzeBlob(file, file.name);
          else if (file) setError("Please drop an audio file (mp3, wav, m4a…).");
        }

        function loadSampleAnalysis() {
          if (audioUrl) URL.revokeObjectURL(audioUrl);
          setAudioBlob(null); setAudioUrl("");
          setWaveform(createSampleWaveform(300));
          setAnalysis({ ...sampleAnalysis, frequencyProfile: { ...sampleAnalysis.frequencyProfile }, themes: [...sampleAnalysis.themes] });
          setGeneratedHtml(""); setPromptText(""); setStreamText(""); setError("");
          setStatus("Sample analysis ready"); setToast("Sample loaded");
        }

        const analyzeBlob = useCallback(async (blob, sourceName) => {
          setError(""); setIsAnalyzing(true); setStatus("Decoding audio");
          setAudioBlob(blob);
          if (audioUrl) URL.revokeObjectURL(audioUrl);
          const nextUrl = URL.createObjectURL(blob);
          setAudioUrl(nextUrl);
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) throw new Error("This browser does not support AudioContext.");
            const context = new AudioCtx();
            const arrayBuf = await blob.arrayBuffer();
            const decoded = await context.decodeAudioData(arrayBuf.slice(0));
            const mono = mixToMono(decoded, Math.min(decoded.duration, 120));
            setStatus("Finding tempo and energy");
            const rms = computeRms(mono);
            const energy = classifyEnergy(rms);
            const bpm = estimateBpm(mono, decoded.sampleRate);
            setStatus("Mapping frequency profile");
            const { profile, dominantRange } = await estimateFrequencyProfile(mono, decoded.sampleRate);
            const mood = deriveMood(bpm, energy);
            const palette = palettes[mood] || palettes.chill;
            const genre = guessGenre(bpm, dominantRange, energy);
            const baseAnalysis = {
              sourceName, duration: decoded.duration, bpm, energy,
              energyScore: Number(rms.toFixed(4)), dominantRange,
              frequencyProfile: {
                bass: Number(profile.bass.toFixed(3)),
                mid:  Number(profile.mid.toFixed(3)),
                treble: Number(profile.treble.toFixed(3)),
              },
              mood, palette, themes: [], transcript: "", genre,
            };
            setWaveform(createWaveform(mono, 300));
            setAnalysis(baseAnalysis);
            setStatus("Analysis ready");
            await context.close();
            if (openaiKey || openaiProxy) await transcribeBlob(blob, sourceName, baseAnalysis);
          } catch (err) {
            setError(err.message || String(err));
            setStatus("Analysis failed");
          } finally {
            setIsAnalyzing(false);
          }
        }, [audioUrl, openaiKey, openaiProxy]);

        const transcribeBlob = useCallback(async (blob, sourceName, currentAnalysis) => {
          setError(""); setIsTranscribing(true); setStatus("Transcribing vocals");
          try {
            const transcript = await callWhisper({
              blob, fileName: sourceName,
              apiKey: openaiKey.trim(), proxyUrl: openaiProxy.trim(),
            });
            const themes = extractThemesFromTranscript(transcript);
            setAnalysis(prev => ({ ...(currentAnalysis || prev), transcript, themes }));
            setStatus(themes.length ? "Lyrics added to analysis" : "Transcription complete");
          } catch (err) {
            setError(err.message || String(err));
            setStatus("Transcription skipped");
          } finally {
            setIsTranscribing(false);
          }
        }, [openaiKey, openaiProxy]);

        async function handleFile(e) {
          const file = e.target.files?.[0];
          if (!file) return;
          await analyzeBlob(file, file.name);
          e.target.value = "";
        }

        async function startRecording() {
          setError("");
          try {
            if (!navigator.mediaDevices?.getUserMedia) throw new Error("This browser does not support microphone capture.");
            if (!window.MediaRecorder) throw new Error("This browser does not support MediaRecorder.");
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            streamRef.current = stream; chunksRef.current = [];
            const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "";
            const recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
            mediaRecorderRef.current = recorder;
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const context = new AudioCtx();
            const src = context.createMediaStreamSource(stream);
            const analyser = context.createAnalyser(); analyser.fftSize = 2048;
            src.connect(analyser);
            recordingContextRef.current = context; analyserRef.current = analyser;
            recorder.addEventListener("dataavailable", e => { if (e.data?.size > 0) chunksRef.current.push(e.data); });
            recorder.addEventListener("stop", async () => {
              const blob = new Blob(chunksRef.current, { type: recorder.mimeType || "audio/webm" });
              stream.getTracks().forEach(t => t.stop());
              await context.close();
              analyserRef.current = null; streamRef.current = null; recordingContextRef.current = null;
              setIsRecording(false);
              await analyzeBlob(blob, `recording-${Date.now()}.webm`);
            });
            recorder.start(); setIsRecording(true); setStatus("Recording");
          } catch (err) {
            setError(err.message || String(err));
            setStatus("Recording unavailable");
          }
        }

        function stopRecording() {
          const r = mediaRecorderRef.current;
          if (r && r.state !== "inactive") { setStatus("Finishing recording"); r.stop(); }
        }

        async function transcribeCurrentAudio() {
          if (!audioBlob) return;
          await transcribeBlob(audioBlob, analysis.sourceName, analysis);
        }

        function saveGeneratedApp(html, engine) {
          const item = {
            id: `${Date.now()}`, html, engine,
            mood: analysis.mood, bpm: analysis.bpm,
            sourceName: analysis.sourceName || "song",
            createdAt: new Date().toISOString(),
          };
          setGallery(prev => {
            const next = [item, ...prev].slice(0, 8);
            saveGallery(next); return next;
          });
        }

        async function generateApp(isRegeneration) {
          if (!hasAnalysis) { setError("Analyze a song first."); return; }
          const nextVar = isRegeneration ? variation + 1 : variation;
          if (isRegeneration) setVariation(nextVar);
          const prompt = makePrompt(analysis, appType, `${rating ? `rating ${rating}/5. ` : ""}${feedback}`.trim(), nextVar);
          setPromptText(prompt); setStreamText(""); setGeneratedHtml(""); setError("");
          setIsGenerating(true); setStatus(isRegeneration ? "Regenerating app" : "Generating app");
          try {
            const fullText = await callClaude({ prompt, apiKey: anthropicKey.trim(), proxyUrl: anthropicProxy.trim(), onText: setStreamText });
            const html = extractHtml(fullText);
            setGeneratedHtml(html); saveGeneratedApp(html, "Claude"); setStatus("Generated app ready");
          } catch (err) {
            setError(err.message || String(err)); setStatus("Generation failed");
          } finally { setIsGenerating(false); }
        }

        function generateDemoApp() {
          if (!hasAnalysis) { setError("Analyze a song first."); return; }
          const nextVar = variation + 1;
          setVariation(nextVar);
          const prompt = makePrompt(analysis, appType, `${rating ? `rating ${rating}/5. ` : ""}${feedback}`.trim(), nextVar);
          const html = generateDemoHtml(analysis, appType, nextVar);
          setPromptText(prompt);
          setStreamText("Demo generation ran locally. Add an Anthropic key or proxy for Claude output.");
          setGeneratedHtml(html); saveGeneratedApp(html, "Demo"); setError(""); setStatus("Demo app ready");
        }

        async function copyCode() {
          if (!generatedHtml) return;
          setToast((await copyText(generatedHtml)) ? "Code copied" : "Copy unavailable");
        }

        async function copyAnalysis() {
          setToast((await copyText(analysisJson)) ? "Analysis copied" : "Copy unavailable");
        }

        function downloadAnalysis() {
          downloadText(analysisJson, `${normalizeFileName(analysis.sourceName || "song-analysis", "song-analysis")}.json`, "application/json;charset=utf-8");
        }

        function loadGalleryItem(item) {
          setGeneratedHtml(item.html);
          setStreamText(`Loaded ${item.engine || "saved"} app from gallery.`);
          setError(""); setStatus("Loaded saved app");
        }

        function downloadGalleryItem(item) { downloadHtml(item.html, item.sourceName || "saved-song-app"); }

        function openGalleryItem(item) { openInTab(item.html); }

        function deleteGalleryItem(id) {
          setGallery(prev => { const next = prev.filter(i => i.id !== id); saveGallery(next); return next; });
          setToast("Saved app removed");
        }

        function clearGallery() { setGallery([]); saveGallery([]); setToast("Gallery cleared"); }

        const analysisJson = JSON.stringify({
          sourceName: analysis.sourceName, duration: formatDuration(analysis.duration),
          bpm: analysis.bpm, energy: analysis.energy, energyScore: analysis.energyScore,
          dominantRange: analysis.dominantRange, frequencyProfile: analysis.frequencyProfile,
          mood: analysis.mood, colorPalette: analysis.palette,
          lyricThemes: activeThemes, genre: analysis.genre, transcript: analysis.transcript,
        }, null, 2);

        /* ─── Render ─── */
        return h("div", { className: "app" },

          /* Topbar */
          h("header", { className: "topbar" },
            h("div", { className: "topbar-inner" },
              h("div", { className: "brand" },
                h("div", { className: "mark", "aria-hidden": "true" }, "S"),
                h("div", { className: "brand-copy" },
                  h("span", { className: "kicker" }, "Audio to interface"),
                  h("h1", null, "Song to App")
                )
              ),
              h("div", { className: "topbar-controls" },
                h("span", { className: "model-chip" }, hasClaudeAccess ? "Claude ready" : "Demo ready"),
                h("button", {
                  className: "theme-toggle",
                  onClick: toggleTheme,
                  title: `Switch to ${theme === "dark" ? "light" : "dark"} mode (Ctrl+D)`,
                  "aria-label": `Switch to ${theme === "dark" ? "light" : "dark"} mode`,
                }, theme === "dark" ? "☀️" : "🌙")
              )
            )
          ),

          /* Main two-column shell */
          h("main", { className: "shell" },

            /* ── LEFT column ── */
            h("section", { className: "left-stack", "aria-label": "Controls" },

              /* Audio Input panel — drag-and-drop wrapper */
              h("div", {
                className: classNames("panel panel-drop-wrap", isDragging && "drag-over"),
                onDragOver, onDragLeave, onDrop,
              },
                h("div", { className: "drop-hint", "aria-hidden": "true" },
                  h("span", null, "🎵"), h("span", null, "Drop audio file to analyze")
                ),
                h("div", { className: "panel-header" },
                  h("h2", { className: "panel-title" }, "Audio Input"),
                  h("div", { className: "hint" }, analysis.sourceName || "No song loaded")
                ),
                h("div", { className: "panel-body" },
                  h("div", { className: "analysis-summary" },
                    h("div", { className: "mood-readout" },
                      h("span", { className: "summary-label" }, "Mood"),
                      h("strong", null, analysis.mood),
                      h("span", { className: "summary-sub", title: analysis.sourceName || status }, analysis.sourceName || status)
                    ),
                    h("div", { className: "tempo-readout" },
                      h("span", { className: "summary-label" }, "Tempo"),
                      h("strong", null, bpmLabel),
                      h("small", null, "BPM")
                    )
                  ),
                  h("div", { className: "actions" },
                    h("label", { className: "file-button primary" },
                      "Upload Song",
                      h("input", {
                        className: "hidden-input",
                        type: "file",
                        accept: "audio/*,.mp3,.wav,.m4a",
                        onChange: handleFile,
                        disabled: busy,
                        "aria-label": "Upload audio file",
                      })
                    ),
                    h(Button, { className: "ghost", onClick: loadSampleAnalysis, disabled: busy }, "Try Sample"),
                    h(Button, {
                      className: isRecording ? "coral" : "",
                      onClick: isRecording ? stopRecording : startRecording,
                      disabled: isAnalyzing || isGenerating,
                      "aria-pressed": isRecording,
                    }, isRecording ? "Stop Recording" : "Record from Mic"),
                    h(Button, {
                      className: "ghost",
                      onClick: transcribeCurrentAudio,
                      disabled: !audioBlob || isTranscribing || !hasWhisperAccess,
                      title: hasWhisperAccess ? "" : "Add an OpenAI key or Whisper proxy first.",
                    }, isTranscribing ? "Transcribing…" : "Transcribe Vocals")
                  ),
                  h("div", { className: "status", role: "status", "aria-live": "polite" },
                    busy && h("span", { className: "spinner", "aria-hidden": "true" }),
                    h("span", null, status)
                  ),
                  h("div", { className: "wave-wrap" },
                    h(WaveformCanvas, { waveform, isRecording, analyserRef, audioRef, palette: analysis.palette })
                  ),
                  audioUrl && h("audio", { ref: audioRef, controls: true, src: audioUrl }),
                  h(ErrorBox, { message: error }),
                  h("div", { className: "metrics" },
                    h(Metric, { label: "BPM",    value: Number.isFinite(analysis.bpm) ? analysis.bpm : "Unknown" }),
                    h(Metric, { label: "Mood",   value: analysis.mood }),
                    h(Metric, { label: "Energy", value: analysis.energy })
                  ),
                  h("div", { className: "metrics" },
                    h(Metric, { label: "Frequency", value: analysis.dominantRange }),
                    h(Metric, { label: "Genre",     value: analysis.genre }),
                    h(Metric, { label: "Length",    value: formatDuration(analysis.duration) })
                  ),
                  h(FrequencyBars, { profile: analysis.frequencyProfile }),
                  h("div", { className: "palette", "aria-label": `Color palette: ${analysis.palette.name}` },
                    analysis.palette.colors.map(color =>
                      h("span", {
                        key: color, className: "swatch",
                        title: color, style: { backgroundColor: color },
                        role: "img", "aria-label": color,
                      })
                    ),
                    h("span", { className: "palette-name" }, analysis.palette.name)
                  )
                ),
                h("details", null,
                  h("summary", null, "Analysis Data", h("span", { "aria-hidden": "true" }, "+")),
                  h("div", { className: "details-body field-grid" },
                    h("div", { className: "actions" },
                      h(Button, { className: "ghost", onClick: copyAnalysis,    disabled: !hasAnalysis }, "Copy Analysis"),
                      h(Button, { className: "ghost", onClick: downloadAnalysis, disabled: !hasAnalysis }, "Download JSON")
                    ),
                    h("pre", { className: "json-view" }, analysisJson)
                  )
                )
              ),

              /* Generation panel */
              h("div", { className: "panel" },
                h("div", { className: "panel-header" },
                  h("h2", { className: "panel-title" }, "Generation"),
                  h("div", { className: "hint" }, activeThemes.slice(0, 3).join(", ") || "Themes pending")
                ),
                h("div", { className: "panel-body field-grid" },
                  h(Field, { label: "App Type" },
                    h("div", { className: "segmented", role: "group", "aria-label": "App type" },
                      ["random","visualizer","game","art","poem","mood board"].map(type =>
                        h("button", {
                          key: type, type: "button",
                          className: classNames("segment", appType === type && "active"),
                          onClick: () => setAppType(type),
                          "aria-pressed": appType === type,
                        }, type.replace(/\b\w/g, l => l.toUpperCase()))
                      )
                    )
                  ),
                  /* Live palette preview in the generation panel */
                  hasAnalysis && h("div", null,
                    h("span", { className: "field" }, h("span", null, "Palette Preview")),
                    h("div", { className: "gen-palette" },
                      analysis.palette.colors.map(c =>
                        h("span", { key: c, className: "gen-palette-swatch", style: { backgroundColor: c }, title: c })
                      ),
                      h("span", { className: "gen-palette-label" }, analysis.palette.name)
                    )
                  ),
                  h(Field, { label: "Feedback" },
                    h("textarea", {
                      value: feedback,
                      onChange: e => setFeedback(e.target.value),
                      placeholder: "More playful, calmer, stranger, more like a game…",
                    })
                  ),
                  h(Field, { label: "Creative Match" },
                    h("select", {
                      value: rating,
                      onChange: e => setRating(Number(e.target.value)),
                    },
                      h("option", { value: 0 }, "Not rated"),
                      h("option", { value: 1 }, "1 — Missed it"),
                      h("option", { value: 2 }, "2 — Close"),
                      h("option", { value: 3 }, "3 — Good"),
                      h("option", { value: 4 }, "4 — Strong"),
                      h("option", { value: 5 }, "5 — Perfect")
                    )
                  ),
                  h("div", { className: "chips", "aria-label": "Active themes" },
                    activeThemes.map(t => h("span", { className: "chip", key: t }, t))
                  ),
                  h("div", { className: "actions" },
                    h(Button, {
                      className: hasClaudeAccess ? "primary" : "",
                      onClick: () => generateApp(false),
                      disabled: !hasAnalysis || isGenerating || !hasClaudeAccess,
                      title: hasClaudeAccess ? "Generate with Claude (Ctrl+G)" : "Add an Anthropic key or Claude proxy first.",
                    }, isGenerating ? "Generating…" : h("span", null, "Generate with Claude", h("kbd", { className: "kbd" }, "⌘G"))),
                    h(Button, {
                      onClick: () => generateApp(true),
                      disabled: !hasAnalysis || isGenerating || !hasClaudeAccess,
                      title: hasClaudeAccess ? "" : "Add an Anthropic key or Claude proxy first.",
                    }, "Regenerate"),
                    h(Button, {
                      className: hasClaudeAccess ? "ghost" : "primary",
                      onClick: generateDemoApp,
                      disabled: !hasAnalysis || isGenerating,
                    }, "Generate Demo")
                  )
                ),
                h("details", null,
                  h("summary", null, "Prompt", h("span", { "aria-hidden": "true" }, "+")),
                  h("div", { className: "details-body" },
                    h("pre", { className: "stream-view" }, promptText || "Generated prompt will appear here.")
                  )
                ),
                h("details", { open: isGenerating || Boolean(streamText && !generatedHtml) },
                  h("summary", null, "Claude Stream", h("span", { "aria-hidden": "true" }, "+")),
                  h("div", { className: "details-body" },
                    h("pre", { className: "stream-view" }, streamText || "Waiting for generation.")
                  )
                )
              ),

              /* API Settings panel */
              h("div", { className: "panel" },
                h("div", { className: "panel-header" },
                  h("h2", { className: "panel-title" }, "API Settings"),
                  h("div", { className: "header-chips" },
                    h("span", { className: classNames("mini-chip", hasClaudeAccess && "ready") },
                      hasClaudeAccess ? "Claude ready" : "Claude off"),
                    h("span", { className: classNames("mini-chip", hasWhisperAccess && "ready") },
                      hasWhisperAccess ? "Whisper ready" : "Whisper off")
                  )
                ),
                h("div", { className: "panel-body field-grid" },
                  h("div", { className: "field-row" },
                    h(Field, { label: "Anthropic Key", id: "anthropic-key" },
                      h("input", { id: "anthropic-key", type: "password", value: anthropicKey, onChange: e => setAnthropicKey(e.target.value), placeholder: "sk-ant-…", autoComplete: "off" })
                    ),
                    h(Field, { label: "Claude Proxy URL", id: "claude-proxy" },
                      h("input", { id: "claude-proxy", value: anthropicProxy, onChange: e => setAnthropicProxy(e.target.value), placeholder: "https://your-proxy/messages" })
                    )
                  ),
                  h("div", { className: "field-row" },
                    h(Field, { label: "OpenAI Key", id: "openai-key" },
                      h("input", { id: "openai-key", type: "password", value: openaiKey, onChange: e => setOpenaiKey(e.target.value), placeholder: "sk-…", autoComplete: "off" })
                    ),
                    h(Field, { label: "Whisper Proxy URL", id: "whisper-proxy" },
                      h("input", { id: "whisper-proxy", value: openaiProxy, onChange: e => setOpenaiProxy(e.target.value), placeholder: "https://your-proxy/transcriptions" })
                    )
                  ),
                  h("p", { className: "hint" },
                    "Use proxy URLs to keep keys server-side. Direct browser calls are convenient for local testing and store keys in this tab's session storage only."
                  )
                )
              )

            ), /* end left-stack */

            /* ── RIGHT column ── */
            h("section", { className: "right-stack", "aria-label": "Preview" },

              /* Generated app preview */
              h("div", { className: "panel preview-shell" },
                h("div", { className: "preview-toolbar" },
                  h("h2", { className: "panel-title" }, "Generated App"),
                  h("div", { className: "preview-toolbar-actions" },
                    h(Button, {
                      onClick: () => generateApp(true),
                      disabled: !hasAnalysis || isGenerating || !hasClaudeAccess,
                      title: hasClaudeAccess ? "" : "Add an Anthropic key or Claude proxy first.",
                    }, "Regenerate"),
                    h(Button, { onClick: copyCode, disabled: !generatedHtml }, "Copy Code"),
                    h(Button, {
                      onClick: () => downloadHtml(generatedHtml, analysis.sourceName || "generated-song-app"),
                      disabled: !generatedHtml,
                    }, "Download"),
                    h(Button, {
                      onClick: () => openInTab(generatedHtml),
                      disabled: !generatedHtml,
                      title: "Open in a new browser tab",
                    }, "Open in Tab")
                  )
                ),
                h("div", { className: "preview-frame-wrap" },
                  generatedHtml
                    ? h("iframe", {
                        title: "Generated song app",
                        sandbox: "allow-scripts allow-forms",
                        srcDoc: generatedHtml,
                      })
                    : h("div", { className: "empty-preview" },
                        h("div", { className: "empty-preview-card" },
                          h("div", { className: "empty-visual", "aria-hidden": "true" },
                            [42,72,36,104,62,126,54,92,44,118,70,48,96,58,82,40].map((height, i) =>
                              h("span", { className: "empty-bar", key: i, style: { "--bar-height": `${height}px` } })
                            )
                          ),
                          h("strong", null, hasAnalysis ? "Ready to generate" : "Waiting for a song"),
                          h("p", null,
                            hasAnalysis
                              ? `${analysis.mood} / ${analysis.energy} / ${Number.isFinite(analysis.bpm) ? `${analysis.bpm} BPM` : "tempo mapped"}`
                              : "Drop an audio file or click Upload Song."
                          ),
                          h("div", { className: "actions" },
                            !hasAnalysis && h(Button, { className: "primary", onClick: loadSampleAnalysis }, "Try Sample"),
                            hasAnalysis && h(Button, {
                              className: hasClaudeAccess ? "ghost" : "primary",
                              onClick: generateDemoApp,
                              disabled: isGenerating,
                            }, "Generate Demo"),
                            hasAnalysis && h(Button, {
                              className: hasClaudeAccess ? "primary" : "",
                              onClick: () => generateApp(false),
                              disabled: isGenerating || !hasClaudeAccess,
                              title: hasClaudeAccess ? "" : "Add an Anthropic key or Claude proxy first.",
                            }, "Generate with Claude")
                          )
                        )
                      )
                )
              ),

              /* Gallery */
              h("div", { className: "panel" },
                h("div", { className: "panel-header" },
                  h("h2", { className: "panel-title" }, "Gallery"),
                  h("div", { className: "actions" },
                    h(Button, { className: "ghost", onClick: clearGallery, disabled: gallery.length === 0 }, "Clear")
                  )
                ),
                h("div", { className: "panel-body" },
                  gallery.length
                    ? h("div", { className: "gallery-grid" },
                        gallery.map(item =>
                          h("div", { className: "gallery-item", key: item.id },
                            /* Mood color stripe at top */
                            h("div", {
                              className: "gallery-mood-bar",
                              style: { background: MOOD_COLORS[item.mood] || MOOD_COLORS.unknown },
                              "aria-hidden": "true",
                            }),
                            h("div", { className: "gallery-name", title: item.sourceName }, item.sourceName),
                            h("div", { className: "gallery-meta" },
                              [item.engine||"App", item.mood||"mood",
                               Number.isFinite(item.bpm) ? `${item.bpm} BPM` : "",
                               formatDateTime(item.createdAt)]
                              .filter(Boolean).join(" · ")
                            ),
                            h("div", { className: "gallery-actions" },
                              h(Button, { onClick: () => loadGalleryItem(item),     className: "ghost" }, "Load"),
                              h(Button, { onClick: () => openGalleryItem(item),     className: "ghost", title: "Open in new tab" }, "Open"),
                              h(Button, { onClick: () => downloadGalleryItem(item), className: "ghost" }, "Download"),
                              h(Button, { onClick: () => deleteGalleryItem(item.id), className: "ghost" }, "Remove")
                            )
                          )
                        )
                      )
                    : h("div", { className: "hint" }, "Generated apps are saved here. Up to 8 are kept in localStorage.")
                )
              )

            ) /* end right-stack */
          ), /* end shell */

          /* Toast notification */
          toast && h("div", { className: "toast", role: "status", "aria-live": "polite" }, toast)

        ); /* end app div */
      } /* end App() */

      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
